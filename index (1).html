<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ereklyebolt — kutatási szimuláció</title>
<style>
/* layout: egyetlen középre igazított "kártya" panel egy sötét, fantasy boltfelület hátterén;
   a kísérlet lépései egymás után, egy image-stack-szerű lapozással jelennek meg ugyanabban a panelben */
:root{
  --bg:#120d1c; --bg2:#1c1430; --panel:#201834; --panel-edge:#3a2a58;
  --ink:#f1e9ff; --ink-dim:#b7a9d9; --gold:#e7c472; --gold-dim:#8a713a;
  --violet:#8b6ae0; --good:#5fbf85; --bad:#e2715f;
  --radius:16px;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100%;
  background:
    radial-gradient(60% 50% at 50% -10%, #3a2359 0%, transparent 60%),
    radial-gradient(80% 60% at 90% 110%, #1c3a4a 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Work Sans", system-ui, sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:28px;
}
h1,h2,h3,.disp{ font-family:"Cinzel", Georgia, serif; text-wrap:balance; letter-spacing:.01em; }
.wrap{ max-width:560px; margin:0 auto; min-width:0; }
.eyebrow{ font-family:"Cinzel",serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); text-align:center; margin:0 0 6px; }
.title{ font-size:22px; text-align:center; margin:0 0 22px; color:var(--ink); }
.panel{
  background:linear-gradient(180deg, var(--panel), #190f29);
  border:1px solid var(--panel-edge);
  border-radius:var(--radius);
  padding:24px 22px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
  overflow:hidden;
}
.panel::before{ content:""; position:absolute; inset:0 0 auto; height:3px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:.6; }
p{ line-height:1.55; color:var(--ink-dim); margin:0 0 14px; font-size:15px; }
strong{ color:var(--ink); }
.btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
button{ font:inherit; cursor:pointer; border-radius:10px; border:1px solid transparent; padding:12px 18px; font-size:14.5px; transition:transform .08s ease, filter .15s ease; }
button:active{ transform:translateY(1px); }
.btn-primary{ background:linear-gradient(180deg,#f3d896,var(--gold)); color:#241607; font-weight:600; border-color:#caa352; flex:1; min-width:140px; }
.btn-primary:disabled{ opacity:.4; cursor:not-allowed; filter:grayscale(.3); }
.btn-primary:not(:disabled):hover{ filter:brightness(1.06); }
.btn-ghost{ background:transparent; color:var(--ink-dim); border-color:var(--panel-edge); }
.btn-ghost:hover{ color:var(--ink); border-color:var(--gold-dim); }
.btn-buy{ background:linear-gradient(180deg,#78e0a0,var(--good)); color:#07271a; font-weight:700; border-color:#3f9466; flex:2.2; min-width:160px; font-size:16px; padding:14px 18px; box-shadow:0 0 0 0 rgba(95,191,133,.5); animation:pulseglow 2.2s ease-in-out infinite; }
.btn-buy:hover{ filter:brightness(1.05); }
@keyframes pulseglow{ 0%,100%{ box-shadow:0 0 0 0 rgba(95,191,133,.35); } 50%{ box-shadow:0 0 0 7px rgba(95,191,133,0); } }
.btn-pass{ background:transparent; color:var(--ink-dim); border-color:transparent; flex:0.8; min-width:90px; font-size:12px; padding:8px 10px; text-decoration:underline; text-decoration-color:var(--panel-edge); }
.btn-pass:hover{ color:var(--ink); }
.urgency{ display:flex; align-items:center; gap:6px; font-size:12px; color:#ff9c6b; font-variant-numeric:tabular-nums; margin-top:6px; }
.urgency b{ font-family:"Cinzel",serif; letter-spacing:.02em; }
.social-proof{ font-size:11.5px; color:var(--ink-dim); margin-top:3px; }
.social-proof b{ color:var(--gold); font-variant-numeric:tabular-nums; }
.field{ margin-bottom:16px; }
label{ display:block; font-size:12.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.08em; margin-bottom:7px; }
select, input[type=number], input[type=text]{
  width:100%; background:#140d22; border:1px solid var(--panel-edge); color:var(--ink);
  border-radius:9px; padding:11px 12px; font:inherit; font-size:15px;
}
select:focus, input:focus{ outline:2px solid var(--violet); outline-offset:1px; }
.wallet{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#15102480; border:1px solid var(--panel-edge); border-radius:11px; padding:10px 14px; margin-bottom:18px; font-size:13.5px; }
.wallet b{ color:var(--gold); font-variant-numeric:tabular-nums; font-family:"Cinzel",serif; }
.item{ display:flex; gap:14px; align-items:center; background:#150f24; border:1px solid var(--panel-edge); border-radius:13px; padding:14px; margin-bottom:6px; }
.icon{ width:56px; height:56px; flex:none; border-radius:10px;
  background:radial-gradient(circle at 35% 30%, #4a3680, #241a3f); border:1px solid var(--gold-dim);
  display:flex; align-items:center; justify-content:center; font-size:26px; }
.item-name{ font-family:"Cinzel",serif; font-size:16px; margin:0 0 3px; color:var(--ink); }
.item-desc{ font-size:12.5px; color:var(--ink-dim); margin:0; }
.price{ margin-left:auto; text-align:right; font-family:"Cinzel",serif; color:var(--gold); font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.price small{ display:block; color:var(--ink-dim); font-family:"Work Sans",sans-serif; font-size:11px; font-weight:400; }
.result-banner{ border-radius:11px; padding:11px 14px; font-size:13.5px; margin:14px 0 2px; border:1px solid; }
.result-banner.ok{ background:#14321f; border-color:var(--good); color:#bdeccf; }
.result-banner.no{ background:#2a1f16; border-color:var(--gold-dim); color:#e7d8b8; }
.scale{ display:flex; gap:6px; margin-top:4px; }
.scale button{ flex:1; padding:12px 0; background:#150f24; border:1px solid var(--panel-edge); color:var(--ink-dim); font-family:"Cinzel",serif; }
.scale button.sel{ background:linear-gradient(180deg,#9b7af0,var(--violet)); color:#160a2e; border-color:#6a4fc2; font-weight:700; }
.scale-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:6px; }
.progress{ display:flex; gap:5px; justify-content:center; margin:0 0 18px; }
.progress i{ width:26px; height:4px; border-radius:3px; background:var(--panel-edge); display:block; }
.progress i.on{ background:var(--gold); }
.code-box{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; background:#0e0918; border:1px solid var(--panel-edge);
  border-radius:9px; padding:12px; color:var(--ink-dim); word-break:break-all; max-height:110px; overflow:auto; margin-bottom:12px; }
.modal-bg{ position:fixed; inset:0; background:rgba(8,5,14,.7); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
.modal{ max-width:380px; width:100%; }
.checkbox-row{ display:flex; gap:10px; align-items:flex-start; background:#150f24; border:1px solid var(--panel-edge); border-radius:11px; padding:13px; margin-bottom:16px; }
.checkbox-row input{ margin-top:3px; accent-color:var(--gold); }
.foot{ text-align:center; font-size:11.5px; color:#6b5f8a; margin-top:16px; }
.admin-btn{ position:fixed; right:max(14px, env(safe-area-inset-right,0px)); bottom:max(14px, env(safe-area-inset-bottom,0px));
  background:#201834; border:1px solid var(--gold-dim); color:var(--gold); border-radius:999px; padding:9px 15px; font-size:12.5px; z-index:15; }
[hidden]{ display:none!important; }
@media (max-width:420px){ .title{font-size:19px} .item{flex-wrap:wrap} .price{margin-left:0; text-align:left} }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Égi Lángok — kutatási szimuláció</p>
  <h1 class="title">Ereklyebolt</h1>
  <div class="progress" id="progress"></div>
  <div class="panel" id="panel"><!-- JS tölti fel --></div>
  <p class="foot">Ez egy egyetemi szakdolgozati kísérlet hipotetikus boltfelülete. Nem történik valódi fizetés.</p>
</div>

<script>
(function(){
"use strict";

/* ---------- kísérleti beállítások ---------- */
var HELYES_FT = 1500;
var ITEM1 = { nev:"Sárkányvér-páncél", leiras:"fiktív kozmetikai felszerelés", icon:"🛡️", ft:1000, kredit:800 };
var ITEM2 = { nev:"Holdfény-köpeny", leiras:"fiktív kozmetikai felszerelés", icon:"🧥", ft:500, kredit:400 };
var ARFOLYAM = 0.8; // 1 Ft = 0,8 kredit
var PACKS = [ {ft:500, kredit:400}, {ft:1500, kredit:1200} ]; // legkisebb elégséges csomagot választjuk

var STEPS = ["consent","demog","intro","offer1","offer2","estimate","done"];

var state = {
  id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()),
  step: 0,
  csoport: null,
  egyenleg: 0,
  elso_elfogadas: null,
  masodik_valoszinuseg: null,
  becsles: "",
  indok: "",
  kor_sav: "", gyakorisag: "", koltes_elozo: "",
  started: Date.now(),
  saved: false
};

var panel = document.getElementById("panel");
var progressEl = document.getElementById("progress");

function render(){
  renderProgress();
  var name = STEPS[state.step];
  panel.innerHTML = "";
  SCREENS[name]();
}
function renderProgress(){
  // a tájékoztató és a köszönő képernyő nem számít lépésnek a sávon
  var visible = STEPS.slice(1, STEPS.length-1);
  var idx = visible.indexOf(STEPS[state.step]);
  progressEl.innerHTML = "";
  if (idx < 0){ progressEl.hidden = true; return; }
  progressEl.hidden = false;
  for (var i=0;i<visible.length;i++){
    var d = document.createElement("i");
    if (i<=idx) d.className = "on";
    progressEl.appendChild(d);
  }
}
function clearOra(){ if (aktivOraId){ clearInterval(aktivOraId); aktivOraId = null; } }
function goto(name){ clearOra(); state.step = STEPS.indexOf(name); render(); window.scrollTo(0,0); }
function next(){ clearOra(); state.step++; render(); window.scrollTo(0,0); }

function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function fmtFt(n){ return n.toLocaleString("hu-HU") + " Ft"; }
function fmtKredit(n){ return n.toLocaleString("hu-HU") + " kredit"; }

/* ---------- képernyők ---------- */
var SCREENS = {};

SCREENS.consent = function(){
  panel.appendChild(el("h2", "disp", "Mielőtt elkezdjük"));
  panel.appendChild(el("p","", "Ez a feladat egy Budapesti Corvinus Egyetemen készülő szakdolgozat kutatásának része. Egy képzeletbeli videojáték boltjában fogsz vásárlási döntéseket hozni. Az összegek szimuláltak, <strong>valódi pénzt nem kell fizetned</strong>, és a feladat kitöltése kb. 3 percet vesz igénybe."));
  panel.appendChild(el("p","", "A részvétel <strong>önkéntes</strong>, bármikor abbahagyhatod. A válaszokat <strong>anonim módon</strong>, kizárólag kutatási célra, összesítve dolgozzuk fel — nem kérünk nevet vagy más azonosító adatot."));
  var row = el("div","checkbox-row");
  var cb = document.createElement("input"); cb.type="checkbox"; cb.id="consentCb";
  var lab = el("label",""); lab.style.margin="0"; lab.style.textTransform="none"; lab.style.letterSpacing="normal"; lab.style.fontSize="13.5px"; lab.style.color="var(--ink)"; lab.htmlFor="consentCb";
  lab.textContent = "18 éves vagy annál idősebb vagyok, elolvastam a fentieket, és önkéntesen részt veszek a kutatásban.";
  row.appendChild(cb); row.appendChild(lab);
  panel.appendChild(row);
  var btns = el("div","btnrow");
  var go = el("button","btn-primary","Kezdés"); go.disabled = true;
  cb.addEventListener("change", function(){ go.disabled = !cb.checked; });
  go.addEventListener("click", next);
  btns.appendChild(go);
  panel.appendChild(btns);
};

SCREENS.demog = function(){
  panel.appendChild(el("h2","disp","Pár gyors kérdés"));
  panel.appendChild(el("p","","Ez segít megérteni, kik vettek részt a kísérletben."));

  function selectField(labelText, id, options){
    var f = el("div","field");
    f.appendChild(el("label","",labelText));
    var s = document.createElement("select"); s.id = id;
    var opt0 = document.createElement("option"); opt0.value=""; opt0.textContent="— válassz —"; s.appendChild(opt0);
    options.forEach(function(o){ var op=document.createElement("option"); op.value=o; op.textContent=o; s.appendChild(op); });
    f.appendChild(s);
    panel.appendChild(f);
    return s;
  }
  var kor = selectField("Korosztályod","korSel",["18–20","21–24","25–29","30 felett"]);
  var gyak = selectField("Milyen gyakran játszol videojátékkal (bármilyen eszközön)?","gyakSel",["szinte minden nap","hetente többször","ritkábban, mint hetente","nem szoktam"]);
  var koltes = selectField("Szoktál mikrotranzakcióra (játékon belüli vásárlásra) költeni?","koltSel",["soha","ritkán, kis összeget","rendszeresen, kisebb összeget","rendszeresen, nagyobb összeget"]);

  var btns = el("div","btnrow");
  var go = el("button","btn-primary","Tovább"); go.disabled = true;
  function check(){ go.disabled = !(kor.value && gyak.value && koltes.value); }
  [kor,gyak,koltes].forEach(function(s){ s.addEventListener("change", check); });
  go.addEventListener("click", function(){
    state.kor_sav = kor.value; state.gyakorisag = gyak.value; state.koltes_elozo = koltes.value;
    next();
  });
  btns.appendChild(go);
  panel.appendChild(btns);
};

SCREENS.intro = function(){
  if (!state.csoport){ state.csoport = (Math.random() < 0.5) ? "A" : "B"; }
  panel.appendChild(el("h2","disp","Belépsz a boltba"));
  if (state.csoport === "A"){
    panel.appendChild(el("p","","Ebben a boltban az árak közvetlenül <strong>forintban</strong> jelennek meg, és egy kattintással, azonnal tudsz vásárolni."));
  } else {
    panel.appendChild(el("p","","Ebben a boltban a tárgyakat a bolt saját valutájával, <strong>kredittel</strong> lehet megvásárolni. A kreditet forintért lehet feltölteni, az árfolyam <strong>1 Ft = 0,8 kredit</strong>."));
    panel.appendChild(el("p","","A kezdő egyenleged 0 kredit. Ha egy tárgyhoz nincs elég kredited, a rendszer felajánlja a legkisebb csomagot, amivel megveheted."));
  }
  panel.appendChild(el("p","","Két tárgyat fogunk megnézni egymás után. Dönts úgy, ahogy egy valódi boltban is döntenél."));
  var btns = el("div","btnrow");
  var go = el("button","btn-primary","A boltba"); go.addEventListener("click", next);
  btns.appendChild(go); panel.appendChild(btns);
};

function walletBar(){
  if (state.csoport !== "B") return null;
  var w = el("div","wallet");
  w.innerHTML = '<span>Egyenleged</span><b>'+fmtKredit(state.egyenleg)+'</b>';
  return w;
}

var aktivOraId = null;
function itemCard(item, kulcs){
  var card = el("div","item");
  card.appendChild(el("div","icon", item.icon));
  var mid = el("div","");
  mid.style.minWidth = "0";
  mid.appendChild(el("p","item-name",item.nev));
  mid.appendChild(el("p","item-desc",item.leiras));

  // sürgetés: visszaszámláló (ugyanaz mindkét csoportban, nem kísérleti tényező)
  var urg = el("div","urgency");
  mid.appendChild(urg);
  if (aktivOraId) clearInterval(aktivOraId);
  var hatralevo = 7*60 + Math.floor(Math.random()*50);
  function frissitOra(){
    var m = Math.floor(hatralevo/60), s = hatralevo%60;
    urg.innerHTML = "⏳ Ajánlat lejár: <b>" + m + ":" + (s<10?"0":"") + s + "</b>";
    hatralevo--;
    if (hatralevo < 0) hatralevo = 7*60 + 59;
  }
  frissitOra();
  aktivOraId = setInterval(frissitOra, 1000);

  // társadalmi bizonyíték
  var tegnap = 60 + Math.floor(Math.random()*70);
  mid.appendChild(el("p","social-proof","🔥 <b>"+tegnap+"</b> játékos vásárolta meg ma"));

  card.appendChild(mid);
  var price = el("div","price");
  if (state.csoport === "A"){
    price.innerHTML = fmtFt(item.ft);
  } else {
    price.innerHTML = fmtKredit(item.kredit) + "<small>"+fmtFt(item.ft)+" értékben</small>";
  }
  card.appendChild(price);
  return card;
}

function offerScreen(item, title){
  panel.appendChild(el("h2","disp",title));
  var wb = walletBar(); if (wb) panel.appendChild(wb);
  panel.appendChild(itemCard(item));

  var banner = el("div","");
  panel.appendChild(banner);

  var btns = el("div","btnrow");
  var buyBtn = el("button","btn-buy","Megveszem most");
  var passBtn = el("button","btn-pass","Most nem, marad a gyengébb felszerelésem");
  btns.appendChild(buyBtn); btns.appendChild(passBtn);
  panel.appendChild(btns);

  var nextRow = el("div","btnrow"); nextRow.hidden = true;
  var nextBtn = el("button","btn-primary","Tovább");
  nextRow.appendChild(nextBtn);
  panel.appendChild(nextRow);

  function finish(accepted){
    state.elso_elfogadas = accepted ? 1 : 0;
    buyBtn.disabled = true; passBtn.disabled = true;
    buyBtn.style.pointerEvents = "none"; passBtn.style.pointerEvents = "none";
    buyBtn.style.opacity = ".45"; passBtn.style.opacity = ".45";
    var b = el("div","result-banner " + (accepted ? "ok":"no"),
      accepted ? "Megvásárolva! A tárgy a fiókodba került." : "Nem vetted meg a tárgyat. Folytatjuk.");
    banner.appendChild(b);
    nextRow.hidden = false;
  }

  passBtn.addEventListener("click", function(){ finish(false); });

  buyBtn.addEventListener("click", function(){
    if (state.csoport === "A"){ finish(true); return; }
    // B csoport: kredit egyenleg kezelése
    if (state.egyenleg >= item.kredit){
      state.egyenleg -= item.kredit;
      finish(true);
      return;
    }
    openTopup(item, function(didBuy){
      if (didBuy) finish(true);
    });
  });

  nextBtn.addEventListener("click", next);
}

function openTopup(item, cb){
  var hiany = item.kredit - state.egyenleg;
  var pack = PACKS[0];
  for (var i=0;i<PACKS.length;i++){ if (PACKS[i].kredit >= hiany){ pack = PACKS[i]; break; } pack = PACKS[i]; }
  if (pack.kredit < hiany){ // biztonsági tartalék, ha mindkét csomag kevés lenne
    pack = { ft: Math.ceil(hiany/ARFOLYAM/50)*50, kredit: hiany };
  }
  var bg = el("div","modal-bg");
  var box = el("div","panel modal");
  box.appendChild(el("h2","disp","Nincs elég kredited"));
  box.appendChild(el("p","","Jelenlegi egyenleged <strong>"+fmtKredit(state.egyenleg)+"</strong>. A legkisebb csomag, amivel megveheted ezt a tárgyat:"));
  var card = el("div","item");
  card.appendChild(el("div","icon","💰"));
  var mid = el("div",""); mid.style.minWidth="0";
  mid.appendChild(el("p","item-name", fmtKredit(pack.kredit)+" csomag"));
  mid.appendChild(el("p","item-desc","egyszeri feltöltés"));
  card.appendChild(mid);
  card.appendChild(el("div","price", fmtFt(pack.ft)));
  box.appendChild(card);
  var btns = el("div","btnrow");
  var buy = el("button","btn-buy","Feltöltés és vásárlás");
  var cancel = el("button","btn-pass","Mégsem");
  btns.appendChild(buy); btns.appendChild(cancel);
  box.appendChild(btns);
  bg.appendChild(box);
  document.body.appendChild(bg);

  cancel.addEventListener("click", function(){ document.body.removeChild(bg); cb(false); });
  buy.addEventListener("click", function(){
    state.egyenleg += pack.kredit - item.kredit;
    document.body.removeChild(bg);
    cb(true);
  });
}

SCREENS.offer1 = function(){ offerScreen(ITEM1, "Első ajánlat"); };

SCREENS.offer2 = function(){
  panel.appendChild(el("h2","disp","Második tárgy"));
  var wb = walletBar(); if (wb) panel.appendChild(wb);
  panel.appendChild(itemCard(ITEM2));
  panel.appendChild(el("p","","Mennyire valószínű, hogy megvásárolnád ezt a tárgyat?"));
  var f = el("div","field");
  var scale = el("div","scale");
  var chosen = null;
  for (var i=1;i<=5;i++){
    (function(i){
      var b = document.createElement("button"); b.type="button"; b.textContent=i;
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(scale.children, function(c){ c.classList.remove("sel"); });
        b.classList.add("sel"); chosen = i; go.disabled = false;
      });
      scale.appendChild(b);
    })(i);
  }
  f.appendChild(scale);
  var labs = el("div","scale-labels","<span>egyáltalán nem valószínű</span><span>nagyon valószínű</span>");
  f.appendChild(labs);
  panel.appendChild(f);
  var btns = el("div","btnrow");
  var go = el("button","btn-primary","Tovább"); go.disabled = true;
  go.addEventListener("click", function(){ state.masodik_valoszinuseg = chosen; next(); });
  btns.appendChild(go); panel.appendChild(btns);
};

SCREENS.estimate = function(){
  panel.appendChild(el("h2","disp","Utolsó kérdés"));
  panel.appendChild(el("p","","Képzeld el, hogy <strong>mindkét tárgyat</strong> megszerezted volna. Szerinted összesen mennyibe került volna ez <strong>forintban</strong>, a saját pénzedből számolva?"));
  var f = el("div","field");
  f.appendChild(el("label","","Becsült összeg (Ft)"));
  var inp = document.createElement("input"); inp.type="number"; inp.min="0"; inp.step="50"; inp.placeholder="Ft"; inp.id="becslesInput";
  f.appendChild(inp);
  panel.appendChild(f);

  var f2 = el("div","field");
  f2.appendChild(el("label","","Mi alapján becsülted?"));
  var sel = document.createElement("select");
  ["fejben összeadtam az árakat","ránézésre, megérzésből","nem gondolkodtam rajta sokat","egyéb"].forEach(function(o){
    var op=document.createElement("option"); op.value=o; op.textContent=o; sel.appendChild(op);
  });
  f2.appendChild(sel);
  panel.appendChild(f2);

  var btns = el("div","btnrow");
  var go = el("button","btn-primary","Befejezés"); go.disabled = true;
  inp.addEventListener("input", function(){ go.disabled = (inp.value === ""); });
  go.addEventListener("click", function(){
    state.becsles = Number(inp.value);
    state.indok = sel.value;
    saveAndFinish();
  });
  btns.appendChild(go); panel.appendChild(btns);
};

SCREENS.done = function(){
  panel.appendChild(el("h2","disp","Köszönjük a részvételt!"));
  if (state.saved === true){
    panel.appendChild(el("div","result-banner ok","A válaszaidat sikeresen rögzítettük."));
  } else {
    panel.appendChild(el("div","result-banner no","A válaszod nem mentődött el automatikusan. Kérlek, másold ki az alábbi kódot, és küldd el a kutatónak (pl. üzenetben), hogy a válaszodat is figyelembe tudja venni."));
    var code = el("div","code-box", JSON.stringify(exportRow()));
    panel.appendChild(code);
    var cbtn = el("button","btn-ghost","Kód másolása");
    cbtn.addEventListener("click", function(){
      var txt = JSON.stringify(exportRow());
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(code); });
      } else { fallbackCopy(code); }
    });
    panel.appendChild(cbtn);
  }
  panel.appendChild(el("p","","Nem kértünk tőled személyes adatot, a válaszod anonim marad."));
};
function fallbackCopy(node){
  var r = document.createRange(); r.selectNodeContents(node);
  var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}



/* ---------- mentés: Google Apps Script webapp (nincs szükség bejelentkezésre) ---------- */
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkd1wX3_hW8-f0RTWlkNf3ybdVoFXwpor-nqPzL0CNKIoHoJDfepLEXrVWLsJRObvC/exec"; // lásd: README_BEALLITAS.md

function exportRow(){
  return {
    csoport: state.csoport,
    elso_elfogadas: state.elso_elfogadas,
    masodik_valoszinuseg: state.masodik_valoszinuseg,
    becsles: state.becsles,
    indok: state.indok,
    kor_sav: state.kor_sav,
    gyakorisag: state.gyakorisag,
    koltes_elozo: state.koltes_elozo,
    idotartam_mp: Math.round((Date.now()-state.started)/1000),
    ts: new Date().toISOString(),
    valasz_id: state.id
  };
}

function saveAndFinish(){
  goto("done"); // azonnal megmutatjuk a köszönő képernyőt, a küldés a háttérben fut
  var row = exportRow();
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("IDE_MASOLD") === 0){
    state.saved = false; render(); return;
  }
  var body = new URLSearchParams();
  Object.keys(row).forEach(function(k){ body.append(k, row[k] == null ? "" : row[k]); });
  fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", body: body })
    .then(function(){ state.saved = true; render(); })
    .catch(function(){ state.saved = false; render(); });
}

/* egyszerű teszt mód: ?test=A vagy ?test=B a linkhez fűzve kényszeríti a csoportot
   (a válasz ekkor sem mentődik), hogy magad is ki tudd próbálni mindkét oldalt */
var saveAndFinish_disabled = false;
(function(){
  var m = /[?&]test=([AB])/.exec(location.search);
  if (m) { state.csoport = m[1]; saveAndFinish_disabled = true; }
})();
var realSaveAndFinish = saveAndFinish;
saveAndFinish = function(){
  if (saveAndFinish_disabled){ goto("done"); state.saved = null; render(); return; }
  realSaveAndFinish();
};

render();
})();
</script>
